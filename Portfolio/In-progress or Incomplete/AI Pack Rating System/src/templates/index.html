<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pack Value Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Ultimate Pack Value Analyzer</h1>
        <form id="upload-form" enctype="multipart/form-data">
            <label for="pack-type">Select Pack Type:</label>
            <select id="pack-type" name="pack-type" required>
                <option value="">--Select Pack Type--</option>
                <!-- Options will be populated by JavaScript -->
            </select>
            <br>
            <label for="image-upload">Upload Pack Screenshot:</label>
            <input type="file" id="image-upload" name="image-upload" accept="image/*" multiple required>
            <br>
            <label for="platform">Platform</label>
            <select id="platform" name="platform">
              <option value="auto" selected>Auto Detect</option>
              <option value="pc">PC / Web App</option>
              <option value="console">Console (PS/Xbox layout)</option>
              <option value="mobile">Mobile Companion</option>
              <option value="ps">PlayStation Market</option>
              <option value="xbox">Xbox Market</option>
            </select>
            <br>
            <label for="game-year">Game Year</label>
            <select id="game-year" name="game-year" required>
              <option value="fifa20">FIFA 20</option>
              <option value="fifa21">FIFA 21</option>
              <option value="fifa22">FIFA 22</option>
              <option value="fifa23">FIFA 23</option>
              <option value="fc24">FC 24</option>
              <option value="fc25">FC 25</option>
              <option value="fc26" selected>FC 26</option>
            </select>
            <br>
            <button type="submit">Analyze Pack</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
